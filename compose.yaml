services:
  web:
    build: .
    container_name: airport-api
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,web"
      SECRET_KEY: "docker-dev-secret-key-change-me"
    volumes:
      - .:/app
